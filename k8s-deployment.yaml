apiVersion: apps/v1
kind: Deployment
metadata:
  name: bachelor-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bachelor-app
  template:
    metadata:
      labels:
        app: bachelor-app
    spec:
      containers:
        - name: bachelor-app
          image: bachelor-app:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
            - containerPort: 3001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: mydb
---
apiVersion: v1
kind: Service
metadata:
  name: bachelor-app-service
  labels:
    app: bachelor-app
spec:
  type: NodePort
  selector:
    app: bachelor-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30001

    - name: metrics
      port: 3001
      targetPort: 3001
      nodePort: 30002
